services:
  jira-ai-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jira-ai-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REPOSITORY_SEARCH_ROOT: /host-repos
      REPOSITORY_HOST_ROOT: /home/ubuntu
      EXCLUDED_REPOSITORY_NAMES: JIRA-AI,forge_fitness

      # IMPORTANT — these point at host services
      OLLAMA_URL: http://host.docker.internal:11434
      # Fail fast: a healthy bge-m3 embed returns in <1s. A 600s ceiling turns a
      # hung/RAM-starved Ollama into a 10-minute "stuck" RCA instead of a quick
      # fallback. Keep this low so embeds fail fast and callers degrade.
      OLLAMA_EMBED_TIMEOUT_SECONDS: 60
      OLLAMA_EMBED_BATCH_SIZE: 32
      OLLAMA_NUM_PARALLEL: 4
      # Serialize embed requests — parallel calls compound RAM pressure on a
      # single host Ollama and make timeouts more likely, not faster.
      OLLAMA_EMBED_CONCURRENCY: 1
      CODEBASE_EMBED_MAX_CHARS: 2000
      CODEBASE_EMBED_MAX_FILES_PER_REPO: 1000
      QDRANT_URL: http://host.docker.internal:6333
      REPO_TREE_SRC_PATH: /app
      REPO_TREE_CONFIG_PATH: /app/repo_tree/config/repos.yaml
      REPO_TREE_WORKSPACE_DIR: /app/repo_tree/workspace
      REPO_TREE_TIMEOUT_SECONDS: 300

      GRAPH_JOB_REPO_TIMEOUT_SECONDS: 3600
      GRAPH_JOB_REPO_CONCURRENCY: 8

      # Use the mounted host SSH key for git pull over SSH (git@github.com).
      # Route via ssh.github.com:443 so it works even when outbound port 22 is
      # blocked (common on AWS). host-key checking is off (key dir is read-only).
      GIT_SSH_COMMAND: "ssh -o HostName=ssh.github.com -o Port=443 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    ports:
      - "8000:8000"

    volumes:
      - /home/ubuntu:/host-repos:rw
      - /home/ubuntu:/home/ubuntu:rw
      - ./repo_tree/workspace:/app/repo_tree/workspace:rw
      # Reuse the ubuntu user's GitHub SSH key so `git pull` can authenticate.
      - /home/ubuntu/.ssh:/root/.ssh:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: jira-ai-postgres
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jira_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - jira_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jira_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jira_ai_postgres_data:
